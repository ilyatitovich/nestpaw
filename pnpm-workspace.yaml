packages:
  - "apps/*"
  - "packages/*"

autoInstallPeers: true
strictPeerDependencies: false

# pnpm 12 defaults this to 1440 (1 day); opt out so installs aren't blocked by fresh transitive releases.
minimumReleaseAge: 0

overrides:
  multer: "^2.5.0"
  # Astro 7 / rolldown pull @emnapi/runtime@2.0.0-beta, which breaks @astrojs/check.
  "@emnapi/runtime": "1.11.3"

allowBuilds:
  "@biomejs/biome": true
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@scarf/scarf": false
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
