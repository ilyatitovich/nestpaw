name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: store
          POSTGRES_PASSWORD: store
          POSTGRES_DB: online_store
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U store -d online_store"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @online-store/shared-types build
      - run: pnpm --filter @online-store/api-client build
      - name: Generate Prisma + migrate
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/online_store?schema=public
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @online-store/api build
      - run: pnpm --filter @online-store/admin build
        env:
          VITE_API_URL: http://localhost:3001
      - run: pnpm --filter @online-store/storefront build
        env:
          PUBLIC_API_URL: http://localhost:3001
          PUBLIC_STORE_URL: http://localhost:4321
      - name: Start API for e2e
        env:
          DATABASE_URL: postgresql://store:store@localhost:5432/online_store?schema=public
          REDIS_URL: redis://localhost:6379
          API_PORT: 3001
          JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars!!
          ALLOW_MOCK_PAYMENTS: "true"
          NODE_ENV: test
          CORS_ORIGINS: http://localhost:4321
        run: |
          pnpm --filter @online-store/api start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/health/live >/dev/null; then
              echo "API up"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start"
          exit 1
      - name: Playwright API critical path
        env:
          PUBLIC_API_URL: http://localhost:3001
          PUBLIC_STORE_URL: http://localhost:4321
          E2E_API: "1"
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test
      - name: Dependency audit (critical)
        run: pnpm audit --prod --audit-level=critical
      - name: Dependency audit (high+)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high
